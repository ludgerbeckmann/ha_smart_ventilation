climate_status:
  name: Klima-Status (Preset-Balken, Textfarbe, Raumstatus, Rollladen, Wechselanzeige)
  version: v4.0
  creator: Smart Climate
  supported:
    - climate
  description: Wird von der Integration Smart Climate mitgeliefert und aktualisiert. Die Farben folgen dem Home-Assistant-Theme; Balken, Anordnung und Wechselwerte werden in den Smart Climate Optionen unter Dashboard-Darstellung gepflegt und hier live aus sensor.smart_climate_darstellung gelesen - Änderungen direkt im Modul gehen beim nächsten Update verloren.
