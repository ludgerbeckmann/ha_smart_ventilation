      --sc-tint-action: color-mix(in srgb, var(--error-color, rgb(244, 67, 54)) 25%, transparent);
      --sc-temp-hot: var(--error-color, rgb(255, 94, 7));
      --sc-temp-cold: var(--state-climate-cool-color, rgb(75, 177, 254));
      --sc-temp-warm: var(--warning-color, rgb(255, 193, 7));
      --sc-cover-bar: var(--state-cover-open-color, #8E6CC3);
