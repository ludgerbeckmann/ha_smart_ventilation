                   (hass.states['sensor.' + entity.split('.')[1] + '_raumstatus'] ? hass.states['sensor.' + entity.split('.')[1] + '_raumstatus'].state : '') === 'hinweis' ? 'var(--sc-tint-hint)' : 'transparent'};
